<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    #container {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    canvas {
      display: block;
    }

    .control-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10001;
      width: min(300px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      color: #9fe8ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.68);
      border: 1px solid rgba(159, 232, 255, 0.24);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }

    .control-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(159, 232, 255, 0.18);
    }

    .control-section:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .control-title {
      color: #d8f7ff;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
      opacity: 0.78;
    }

    .file-control {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 8px 10px;
      color: #021017;
      background: #9fe8ff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      text-align: center;
    }

    .control-row {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .control-row.color-row {
      grid-template-columns: 1fr 48px;
    }

    .control-row span:first-child {
      overflow-wrap: anywhere;
    }

    .control-value {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      min-width: 0;
    }

    input[type="color"] {
      width: 44px;
      height: 28px;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 560px) {
      .control-panel {
        right: 12px;
        width: auto;
        max-height: 42vh;
        font-size: 12px;
      }

      .control-row {
        grid-template-columns: 68px minmax(0, 1fr) 38px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="c"></canvas>
  </div>
  <div class="control-panel" aria-label="Controles de geometria 3D">
    <section class="control-section">
      <label id="audioLabel" class="file-control" for="audioUpload">
        Carga un archivo de audio
        <input id="audioUpload" type="file" accept="audio/*">
      </label>
    </section>

    <section id="coreControl" class="control-section">
      <div class="control-title">Esfera y glow</div>
      <label class="control-row">
        <span>Core</span>
        <input id="coreSizeSlider" type="range" min="0.5" max="3" step="0.01" value="1">
        <span id="coreSizeLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Glow</span>
        <input id="glowSizeSlider" type="range" min="0.4" max="3" step="0.01" value="1">
        <span id="glowSizeLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Brillo</span>
        <input id="glowBrightnessSlider" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="glowBrightnessLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Distorsion</span>
        <input id="distortionSlider" type="range" min="0" max="1" step="0.01" value="0">
        <span id="distortionLabel" class="control-value">0.00</span>
      </label>
      <label class="control-row color-row">
        <span>Sphere color</span>
        <input id="coreColorPicker" type="color" value="#66ccff">
      </label>
      <label class="control-row color-row">
        <span>Glow color</span>
        <input id="glowColorPicker" type="color" value="#66ccff">
      </label>
    </section>

    <section id="geomControls" class="control-section">
      <div class="control-title">Geometria</div>
      <label class="control-row">
        <span>Fol</span>
        <input id="folScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="folLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Metatron</span>
        <input id="metatronScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="metatronLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Merkaba</span>
        <input id="merkabaScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="merkabaLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Sri</span>
        <input id="sriScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="sriLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Spiral</span>
        <input id="spiralScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="spiralLabel" class="control-value">1.00</span>
      </label>
      <label class="control-row">
        <span>Particles</span>
        <input id="particlesScale" type="range" min="0.2" max="3" step="0.01" value="1">
        <span id="particlesLabel" class="control-value">1.00</span>
      </label>
    </section>
  </div>
  <script src="js/geometriasagrada3d.js"></script>
</body>

</html>
